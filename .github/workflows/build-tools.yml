name: Build tools package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Linux toolchain image
        run: docker build --platform linux/amd64 -f tools/build-tools/Dockerfile -t acv-build-tools-ci .
      - name: Build x86-64-v2 launcher and capture documentation
        run: |
          docker run --rm -v "$PWD:/work" acv-build-tools-ci bash -c '
            npm ci --prefix tools/decomp-logging &&
            node tools/decomp-logging/cli.mjs run --stage clean-launcher-build --timeout-ms 1200000 -- bash tools/build-tools/verify_launcher.sh'
      - name: Upload build evidence and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-docs-linux
          path: |
            tmp/install-docs/
            logs/
      - name: Publish toolchain to GitHub Packages
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/grayrats/acv-build-tools
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag acv-build-tools-ci "$IMAGE:x86-64-v2-${GITHUB_SHA}"
          docker tag acv-build-tools-ci "$IMAGE:latest"
          docker push "$IMAGE:x86-64-v2-${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:x86-64-v2-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
