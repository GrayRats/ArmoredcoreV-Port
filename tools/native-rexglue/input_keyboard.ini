; Keyboard layout of player one (emulated controller). Keys of [input] are SDK cvars passed as --name=value;
; [env] holds environment variables for the game process. Used by "Keyboard & Mouse" and "Keyboard" modes:
; probe_linux.py (acv_input.py) sets mnk_mouse=false and drops mouse-button bindings for the keyboard-only mode.
; Several keys for one button are comma-separated. F8 toggles mouse look in the game window.
[input]
mnk_mode = true
mnk_mouse = true
mnk_sensitivity = 1.0
keybind_lstick_up = W
keybind_lstick_down = S
keybind_lstick_left = A
keybind_lstick_right = D
keybind_lstick_press = V
keybind_rstick_up = I
keybind_rstick_down = K
keybind_rstick_left = J
keybind_rstick_right = L
keybind_rstick_press = MMB,C
keybind_a = Space
keybind_b = Backspace,Escape
keybind_x = R
keybind_y = F
keybind_left_trigger = RMB,U
keybind_right_trigger = LMB,O
keybind_left_shoulder = Q
keybind_right_shoulder = E
keybind_dpad_up = Up,1
keybind_dpad_down = Down,2
keybind_dpad_left = Left,3
keybind_dpad_right = Right,4
keybind_back = Tab
keybind_start = Return

[env]
